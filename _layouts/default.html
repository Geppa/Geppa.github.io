<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}{{ site.og_image }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ site.title }}">
<meta name="twitter:description" content="{{ site.description }}">
<meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}{{ site.og_image }}">

<link rel="icon" href="{{ site.baseurl }}/assets/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#eae7e0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css?v={{ site.time | date: '%s' }}">
</head>
<body>
{% assign p = site.data.profile %}
<header class="masthead">
  <div class="wrap masthead-grid rise">
    <nav class="tabs" aria-label="Pages">
      <a class="tab{% if page.tab == 'bio' %} is-active{% endif %}" href="{{ site.baseurl }}/"{% if page.tab == 'bio' %} aria-current="page"{% endif %}>Bio</a>
      <a class="tab{% if page.tab == 'projects' %} is-active{% endif %}" href="{{ site.baseurl }}/projects/"{% if page.tab == 'projects' %} aria-current="page"{% endif %}>Projects</a>
    </nav>
    <img class="portrait" src="{{ p.photo }}" alt="{{ p.photo_alt }}" width="240" height="300">
    <div class="ident-block">
      <div class="ident">
        <span class="rule" aria-hidden="true"></span>
        <h1 class="name">{{ p.name }}</h1>
        <p class="role">{{ p.role }}</p>
      </div>
      {% if p.now and p.now != "" %}
      <p class="now"><span class="now-label">Now</span><span class="now-text">{{ p.now }}</span></p>
      {% endif %}
      <nav class="links" aria-label="Links">
        {% for l in p.links %}<a class="ul" href="{{ l.url }}">{{ l.label }}</a>{% endfor %}
      </nav>
    </div>
  </div>
</header>

{{ content }}
<script src="{{ site.baseurl }}/assets/js/main.js" defer></script>
</body>
</html>
