# Paragraphs. HTML allowed.
bio:
  - >-
    I am a Ph.D. student in Artificial Intelligence at
    <a href="https://khu.ac.kr/">Kyung Hee University</a>, advised by Prof.
    <a href="https://sites.google.com/site/sseongtaekim/home">Seong-Tae Kim</a> in the
    <a href="http://ami.khu.ac.kr/">AugMented Intelligence (AMI) Laboratory</a>.
    My research focuses on video-language understanding, with a particular interest in
    long-form and streaming videos that involve extended temporal contexts.
  - >-
    A central theme of my work is memory-augmented video understanding: how models can
    retain, structure, and retrieve visual evidence over long temporal contexts. I study
    this problem through dense video captioning and video question answering, where models
    need to localize relevant events and reason over temporally distributed information.
  - >-
    Looking ahead, I hope to extend video understanding toward more realistic and
    interactive settings, such as egocentric video and embodied/VLA scenarios, where
    perception can eventually support action.

